<title>Slate Executive Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   SLATE — built on Docket 2.0.
   Token layer lifted verbatim from the design system.
   Light is the source of truth; dark redefines tokens only.
   ============================================================ */
:root{
  --paper:#FFFFFF;
  --chrome:#F7F6F4;
  --sunken:#F1EEEA;
  --line:#E4E0DA;
  --line-strong:#CDC7BF;

  --ink:#22201C;
  --ink-2:#55504A;
  --ink-3:#7E776F;

  --accent:#1D4E89;
  --accent-deep:#163C6B;
  --accent-tint:#E9F0F8;
  --accent-on:#FFFFFF;
  --focus:#1D4E89;
  --focus-halo:#FFFFFF;

  --ok:#2C6A4D;   --ok-tint:#E7F1EB;
  --wait:#7F5C15; --wait-tint:#F6EEDC;
  --stop:#9E2F29; --stop-tint:#F8EAE8;
  --idle:#5B5650; --idle-tint:#EEEBE7;

  --r-1:3px; --r-2:6px; --r-3:10px;

  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px;
  --s-6:32px; --s-7:48px; --s-8:72px; --s-9:112px;

  --shadow:0 1px 2px rgba(34,32,28,.06), 0 4px 14px -8px rgba(34,32,28,.18);
  --measure:66ch;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#17191C; --chrome:#121417; --sunken:#1E2126;
    --line:#2C3137; --line-strong:#3F464E;
    --ink:#E9E7E3; --ink-2:#B2ADA6; --ink-3:#877F77;
    --accent:#84B4EE; --accent-deep:#A9CCF6; --accent-tint:#15243A; --accent-on:#0D1420;
    --focus:#9CC4F2; --focus-halo:#17191C;
    --ok:#6FC195;   --ok-tint:#12251C;
    --wait:#D5AC5C; --wait-tint:#282011;
    --stop:#E8827B; --stop-tint:#2B1614;
    --idle:#9A948C; --idle-tint:#22252A;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#17191C; --chrome:#121417; --sunken:#1E2126;
  --line:#2C3137; --line-strong:#3F464E;
  --ink:#E9E7E3; --ink-2:#B2ADA6; --ink-3:#877F77;
  --accent:#84B4EE; --accent-deep:#A9CCF6; --accent-tint:#15243A; --accent-on:#0D1420;
  --focus:#9CC4F2; --focus-halo:#17191C;
  --ok:#6FC195;   --ok-tint:#12251C;
  --wait:#D5AC5C; --wait-tint:#282011;
  --stop:#E8827B; --stop-tint:#2B1614;
  --idle:#9A948C; --idle-tint:#22252A;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ============================================================ base */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--chrome);
  color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:500}
p{margin:0}
a{color:var(--accent); text-underline-offset:.18em; text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-1); box-shadow:0 0 0 2px var(--focus-halo)}
::selection{background:var(--accent-tint); color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.tnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important}
}

/* ============================================================ shell */
.shell{display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100vh}
.rail{
  position:sticky; top:0; align-self:start; height:100vh;
  background:var(--chrome); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:var(--s-4);
  padding:var(--s-5) var(--s-4); overflow-y:auto;
}
.rail__brand{display:flex; align-items:center; gap:10px}
.rail__name{font-family:"Newsreader",Georgia,serif; font-size:20px; letter-spacing:-.01em; line-height:1}
.rail__ver{
  font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700;
  color:var(--accent); background:var(--accent-tint); padding:2px 6px; border-radius:var(--r-1);
  margin-left:auto;
}
.rail__group{display:flex; flex-direction:column; gap:1px}
.rail__label{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); padding:0 8px var(--s-2)}
.rail__link{
  display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:var(--r-2);
  color:var(--ink-2); font:inherit; font-size:14px; line-height:1.5; text-align:left;
  background:none; border:0; width:100%; cursor:pointer;
}
.rail__link:hover{background:var(--sunken); color:var(--ink)}
.rail__link[aria-current="page"]{background:var(--accent-tint); color:var(--accent); font-weight:600}
.rail__num{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); min-width:1.5em; font-variant-numeric:tabular-nums}
.rail__link[aria-current="page"] .rail__num{color:var(--accent)}
.rail__tail{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rail__foot{margin-top:auto; border-top:1px solid var(--line); padding-top:var(--s-4); display:flex; flex-direction:column; gap:var(--s-3)}
.rail__note{font-size:11.5px; line-height:1.45; color:var(--ink-3)}

.themeswap{display:flex; gap:2px; padding:2px; background:var(--sunken); border:1px solid var(--line); border-radius:var(--r-2)}
.themeswap button{flex:1; font:inherit; font-size:12px; font-weight:600; cursor:pointer; padding:4px 2px; border:0; border-radius:var(--r-1); background:transparent; color:var(--ink-3)}
.themeswap button[aria-pressed="true"]{background:var(--paper); color:var(--ink); box-shadow:var(--shadow)}

/* ============================================================ page frame */
.page{background:var(--paper); min-width:0}
.wrap{max-width:1120px; margin:0 auto; padding:0 var(--s-6)}
.prose{max-width:var(--measure); color:var(--ink-2)}

.masthead{border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; background:var(--paper)}
.masthead__in{display:flex; align-items:center; gap:var(--s-3); flex-wrap:wrap; padding:9px 0; font-size:11.5px; color:var(--ink-3)}
.dot{width:3px; height:3px; border-radius:50%; background:var(--line-strong); flex:none}

.eyebrow{font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); display:flex; align-items:center; gap:10px}
.section{padding:var(--s-7) 0; border-bottom:1px solid var(--line)}
.section:last-of-type{border-bottom:0}
.section__head{display:flex; gap:var(--s-4); align-items:flex-start; margin-bottom:var(--s-5); flex-wrap:wrap}
.section__num{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3); padding-top:9px; flex:none; font-variant-numeric:tabular-nums}
.sub{font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); margin:var(--s-6) 0 var(--s-4); padding-bottom:var(--s-2); border-bottom:1px solid var(--line)}

.spec{border:1px solid var(--line); border-radius:var(--r-3); overflow:hidden; background:var(--paper)}
.spec__bar{display:flex; align-items:center; gap:var(--s-2); padding:7px var(--s-4); background:var(--chrome); border-bottom:1px solid var(--line); font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.spec__body{padding:var(--s-5)}
.spec__body--flush{padding:0}

.row{display:flex; flex-wrap:wrap; gap:var(--s-3); align-items:center}
.row--tight{gap:var(--s-2)}
.stack{display:flex; flex-direction:column; gap:var(--s-4)}
.stack--tight{gap:var(--s-3)}
.stack--loose{gap:var(--s-5)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:var(--s-4)}
.grid2--wide{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--s-4)}
.spacer{margin-left:auto}

/* ============================================================ type */
.t-display{font-family:"Newsreader",Georgia,serif; font-size:2.6rem; line-height:1.06; letter-spacing:-.025em; font-weight:500}
.t-title{font-family:"Newsreader",Georgia,serif; font-size:2rem; line-height:1.14; letter-spacing:-.018em; font-weight:500}
.t-sub{font-family:"Newsreader",Georgia,serif; font-size:1.4rem; line-height:1.2; letter-spacing:-.015em; font-weight:500}
.t-head{font-size:1.0625rem; font-weight:600; letter-spacing:-.005em; line-height:1.4}
.t-body{font-size:1.0625rem; line-height:1.62}
.t-small{font-size:.875rem; line-height:1.55; color:var(--ink-2)}
.t-label{font-size:.6875rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3)}
.t-data{font-family:"IBM Plex Mono",monospace; font-size:.8125rem; font-variant-numeric:tabular-nums}

/* ============================================================ tables */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-3)}
.spec__body--flush .tablewrap{border:0; border-radius:0}
table{border-collapse:collapse; width:100%; font-size:14px}
thead th{
  text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); padding:10px var(--s-4); background:var(--chrome); border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:11px var(--s-4); border-bottom:1px solid var(--line); vertical-align:middle; color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody td:first-child{color:var(--ink)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunken)}

/* ============================================================ actions */
.btn{
  font:inherit; font-size:14px; font-weight:600; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:40px; padding:0 16px; border-radius:var(--r-2);
  border:1px solid transparent; cursor:pointer; text-decoration:none;
  transition:background-color .12s ease, border-color .12s ease;
}
.btn--primary{background:var(--accent); color:var(--accent-on); border-color:var(--accent)}
.btn--primary:hover{background:var(--accent-deep); border-color:var(--accent-deep)}
.btn--secondary{background:var(--paper); color:var(--ink); border-color:var(--line-strong)}
.btn--secondary:hover{background:var(--sunken)}
.btn--ghost{background:transparent; color:var(--accent)}
.btn--ghost:hover{background:var(--accent-tint)}
.btn--danger{background:var(--paper); color:var(--stop); border-color:color-mix(in srgb,var(--stop) 45%,transparent)}
.btn--danger:hover{background:var(--stop-tint)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn--sm{min-height:32px; padding:0 11px; font-size:13px}

/* ============================================================ forms */
.field{display:flex; flex-direction:column; gap:5px}
.field__label{font-size:13.5px; font-weight:600}
.field__req{color:var(--stop); font-weight:700}
.field__hint{font-size:12.5px; color:var(--ink-3); line-height:1.45}
.input{
  font:inherit; font-size:15px; color:var(--ink);
  min-height:42px; padding:8px 11px;
  background:var(--paper); border:1px solid var(--line-strong); border-radius:var(--r-2);
  width:100%;
}
textarea.input{min-height:104px; line-height:1.55; resize:vertical; font-size:14.5px}
.input::placeholder{color:var(--ink-3)}
.input:hover{border-color:var(--ink-3)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14.5px; cursor:pointer}
.check input{width:18px; height:18px; margin:2px 0 0; accent-color:var(--accent); flex:none}
.check span small{display:block; font-size:12.5px; color:var(--ink-3); line-height:1.45}

/* ============================================================ status */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:3px 10px 3px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap}
.pill--ok{color:var(--ok); background:var(--ok-tint); border-color:color-mix(in srgb,var(--ok) 22%,transparent)}
.pill--wait{color:var(--wait); background:var(--wait-tint); border-color:color-mix(in srgb,var(--wait) 22%,transparent)}
.pill--stop{color:var(--stop); background:var(--stop-tint); border-color:color-mix(in srgb,var(--stop) 22%,transparent)}
.pill--idle{color:var(--idle); background:var(--idle-tint); border-color:color-mix(in srgb,var(--idle) 22%,transparent)}
.pill--info{color:var(--accent); background:var(--accent-tint); border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
.pill--sm{font-size:11px; padding:1px 8px}

.notice{display:flex; gap:var(--s-3); padding:var(--s-4); border-radius:var(--r-2); border:1px solid var(--line); border-left-width:3px; background:var(--sunken)}
.notice__t{font-size:14px; font-weight:700; margin-bottom:2px}
.notice__b{font-size:13.5px; line-height:1.55; color:var(--ink-2)}
.notice--info{background:var(--accent-tint); border-color:color-mix(in srgb,var(--accent) 22%,transparent); border-left-color:var(--accent)}
.notice--info .notice__t{color:var(--accent)}
.notice--stop{background:var(--stop-tint); border-color:color-mix(in srgb,var(--stop) 22%,transparent); border-left-color:var(--stop)}
.notice--stop .notice__t{color:var(--stop)}
.notice--ok{background:var(--ok-tint); border-color:color-mix(in srgb,var(--ok) 22%,transparent); border-left-color:var(--ok)}
.notice--ok .notice__t{color:var(--ok)}
.notice--wait{background:var(--wait-tint); border-color:color-mix(in srgb,var(--wait) 22%,transparent); border-left-color:var(--wait)}
.notice--wait .notice__t{color:var(--wait)}

.tabs{display:flex; gap:var(--s-5); border-bottom:1px solid var(--line); overflow-x:auto}
.tab{font:inherit; font-size:14px; font-weight:600; background:none; border:0; cursor:pointer; padding:0 0 9px; color:var(--ink-3); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}

.crumbs{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-3); flex-wrap:wrap}
.crumbs button{font:inherit; font-size:12.5px; background:none; border:0; padding:0; cursor:pointer; color:var(--ink-3)}
.crumbs button:hover{color:var(--ink); text-decoration:underline}
.crumbs b{font-weight:600; color:var(--ink)}

.quote{border-left:3px solid var(--accent); padding:2px 0 2px var(--s-4); font-family:"Newsreader",Georgia,serif; font-size:1.15rem; line-height:1.5; font-style:italic; color:var(--ink)}
.quote cite{display:block; font:600 12px/1.4 "Public Sans",sans-serif; font-style:normal; color:var(--ink-3); margin-top:8px; letter-spacing:.02em}
details.toggle{border-bottom:1px solid var(--line); padding:var(--s-3) 0}
details.toggle summary{cursor:pointer; font-size:14.5px; font-weight:600; list-style:none; display:flex; gap:9px; align-items:center}
details.toggle summary::-webkit-details-marker{display:none}
details.toggle summary::before{content:""; width:0; height:0; border:5px solid transparent; border-left-color:var(--ink-3); margin-left:2px; transition:transform .15s ease}
details.toggle[open] summary::before{transform:rotate(90deg) translateX(-1px)}

/* ============================================================ record */
.record{border:1px solid var(--line); border-radius:var(--r-3); overflow:hidden}
.record__top{padding:var(--s-5) var(--s-5) var(--s-4); border-bottom:1px solid var(--line)}
.record__no{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3); letter-spacing:.04em}
.record__title{font-family:"Newsreader",Georgia,serif; font-size:1.75rem; line-height:1.15; letter-spacing:-.018em; margin:6px 0 var(--s-4)}
.record__meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:var(--s-4) var(--s-5)}
.record__k{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.record__v{font-size:14px; margin-top:3px}
.record__bar{display:flex; gap:var(--s-2); padding:var(--s-3) var(--s-5); background:var(--chrome); flex-wrap:wrap; align-items:center}

/* ============================================================ steps */
.steps{display:flex; flex-direction:column; gap:0}
.step{display:grid; grid-template-columns:30px minmax(0,1fr); gap:var(--s-4); padding-bottom:var(--s-5); position:relative}
.step:last-child{padding-bottom:0}
.step::before{content:""; position:absolute; left:14px; top:30px; bottom:0; width:1px; background:var(--line)}
.step:last-child::before{display:none}
.step__n{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-3); position:relative; z-index:1}
.step--done .step__n{background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.step--now .step__n{border-color:var(--accent); border-width:2px; color:var(--accent); font-weight:700}
.step__t{font-size:15px; font-weight:600; padding-top:3px; display:flex; gap:var(--s-2); align-items:center; flex-wrap:wrap}
.step__d{font-size:13.5px; color:var(--ink-2); line-height:1.55; margin-top:3px}
.step__foot{display:flex; gap:var(--s-3); align-items:center; flex-wrap:wrap; margin-top:var(--s-3)}

.kbd{font-family:"IBM Plex Mono",monospace; font-size:11.5px; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:var(--r-1); padding:1px 5px; background:var(--paper); color:var(--ink-2)}
.footer{padding:var(--s-6) 0 var(--s-8); color:var(--ink-3); font-size:12.5px; display:flex; flex-wrap:wrap; gap:var(--s-4); align-items:baseline; justify-content:space-between}

/* ============================================================
   SLATE additions — new components, tokens only, no new colors.
   ============================================================ */

/* the who-am-I control: the multi-user model made visible */
.whoami{border:1px solid var(--line); border-radius:var(--r-3); background:var(--paper); overflow:hidden}
.whoami__hd{padding:6px var(--s-3) 5px; border-bottom:1px solid var(--line); background:var(--sunken)}
.whoami__list{display:flex; flex-direction:column; padding:var(--s-1)}
.whoami__opt{
  display:flex; gap:9px; align-items:flex-start; text-align:left; width:100%;
  font:inherit; font-size:13px; line-height:1.4; background:none; border:0; cursor:pointer;
  padding:6px 7px; border-radius:var(--r-2); color:var(--ink-2);
}
.whoami__opt:hover{background:var(--sunken)}
.whoami__opt[aria-pressed="true"]{background:var(--accent-tint); color:var(--accent)}
.whoami__init{
  width:24px; height:24px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;
  border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-3);
}
.whoami__opt[aria-pressed="true"] .whoami__init{background:var(--accent); border-color:var(--accent); color:var(--accent-on)}
.whoami__nm{font-weight:600; display:block; color:var(--ink)}
.whoami__opt[aria-pressed="true"] .whoami__nm{color:var(--accent)}
.whoami__rl{font-size:11.5px; color:var(--ink-3); display:block}

/* summary tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:var(--s-3)}
.tile{border:1px solid var(--line); border-radius:var(--r-3); padding:var(--s-4); background:var(--paper); display:flex; flex-direction:column; gap:2px}
.tile__k{font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.tile__v{font-family:"Newsreader",Georgia,serif; font-size:2.1rem; line-height:1.05; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.tile__n{font-size:12.5px; color:var(--ink-3); line-height:1.4}
.tile--act{border-color:color-mix(in srgb,var(--accent) 40%,transparent); background:var(--accent-tint)}
.tile--act .tile__v{color:var(--accent)}
.tile--act .tile__k{color:var(--accent)}

/* criterion chips — the spine objects from Step 1 */
.crits{display:flex; flex-wrap:wrap; gap:var(--s-2)}
.crit{
  display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
  border:1px solid var(--line-strong); border-radius:var(--r-2);
  padding:3px 4px 3px 9px; background:var(--paper); color:var(--ink);
}
.crit__w{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500;

/* sealed panel — scores hidden until release */
.seal{

];

  {w:'Priya Raman',   x:'uploaded the executed confidentiality acknowledgement for C-03', t:'4h ago'},

/* ---------- state ---------- */
const state = {
  user:'u1',
  view:'overview',
  sel:null,
  released:false,
  weights:{},
  scores:{},
  ratings:{},
  notes:{},
  tab:'community',
  doc:null,
  survey:{},
  submitted:false,
  scorecardIn:false,
  reminded:{}
};
CRITERIA.forEach(c=>state.weights[c.id]=c.w);
CANDIDATES.forEach(c=>{ state.scores[c.id]={}; CRITERIA.forEach((k,i)=>state.scores[c.id][k.id]=c.sc[i]); });

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const me = ()=>PEOPLE.find(p=>p.id===state.user);
const role = ()=>me().role;
const cand = id=>CANDIDATES.find(c=>c.id===id);
const crit = id=>CRITERIA.find(c=>c.id===id);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fit(c){
  let num=0, den=0;
  CRITERIA.forEach(k=>{ const w=state.weights[k.id]; num += w*state.scores[c.id][k.id]; den += w*5; });
  return den ? Math.round(num/den*100) : 0;
}
function band(v){ return v>=4?4 : v===3?3 : v===2?2 : 1; }
function fitClass(p){ return p>=80?'ok' : p>=65?'' : p>=50?'wait':'idle'; }
function ranked(list){ return [...list].sort((a,b)=>fit(b)-fit(a)); }
function critChip(id, on){
  const c = crit(id); if(!c) return '';
  return `<span class="crit ${on?'crit--hi':''}"><span class="crit__id">${c.id}</span>${esc(c.label)}<span class="crit__w">w${state.weights[c.id]}</span></span>`;
}
function critTag(id){
  const c = crit(id); if(!c) return '';
  return `<span class="pill pill--info pill--sm mono">${c.id}</span>`;
}
function bar(pct, cls){
  return `<span class="bar"><span class="bar__t"><span class="bar__f ${cls?'bar__f--'+cls:''}" style="width:${pct}%"></span></span><span class="bar__n">${pct}</span></span>`;
}
function stagePill(s){
  const m = {
    finalist:['ok','Finalist'], semifinalist:['info','Semifinalist'],
    applicant:['idle','Applicant'], declined:['stop','Declined']
  }[s] || ['idle',s];
  return `<span class="pill pill--${m[0]}">${m[1]}</span>`;
}
function ico(name){
  const p = {
    lock:'<path d="M5 8V6a3 3 0 0 1 6 0v2M4 8h8v6H4z"/>',
    check:'<path d="M3 8.5 6.2 12 13 4.5"/>',
    alert:'<path d="M8 3v6M8 12h.01"/><circle cx="8" cy="8" r="6.5"/>',
    arrow:'<path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/>',
    info:'<circle cx="8" cy="8" r="6.5"/><path d="M8 7.5v4M8 4.8h.01"/>'
  }[name] || '';
  return `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}
function toast(msg){
  const el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.hidden = true; }, 2800);
}
</script>

                   ${[1,2,3,4,5].map(n=>`<button type="button" data-weight="${c.id}" data-val="${n}" aria-pressed="${state.weights[c.id]===n}">${n}</button>`).join('')}
                 </div>`
              : `<span class="crit__w" style="font-size:12px">weight ${state.weights[c.id]}</span>`}
          </div>`).join('')}
      </div>
    </div>`).join('');

  const top = ranked(CANDIDATES).slice(0,3);

  return `
  ${head('Step 1', 'Candidate profile',
    'This is the spine of the search. Each line below is a record, not a bullet in a document &mdash; the advertisement, the surveys, the interview questions, the screening rubric, the finalist comparison, and the first-year performance goals all point back to these sixteen records by name.',
    editable ? `<button class="btn btn--primary" data-act="publish">Publish revision 4</button><button class="btn btn--secondary" data-act="compare">Compare to revision 3</button>` : `<span class="pill pill--ok">${ico('check')}Adopted by Council, 7&ndash;0, 12 Jun 2026</span>`)}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    ${editable ? `<div class="notice notice--wait">${ico('alert')}<div><div class="notice__t">Changing a weight changes every score already recorded</div>
      <div class="notice__b">Weights feed the screening rollup and the finalist comparison live. Try moving one and watch the fit percentages below move with it. In a real search this would be locked once Council adopts the profile.</div></div></div>`:''}
    <div class="grid2 grid2--wide" style="align-items:start">${grid}</div>

    <div>
      <div class="sub">Live effect of the current weighting</div>
      <div class="grid3">
        ${top.map((c,i)=>`
          <div class="tile ${i===0?'tile--act':''}">
            <span class="tile__k">${i===0?'Strongest fit':'Rank '+(i+1)}</span>
            <span class="tile__v">${fit(c)}<span style="font-size:1rem;color:var(--ink-3)">%</span></span>
            <span class="tile__n">${esc(c.name)}</span>
          </div>`).join('')}
      </div>
    </div>

    <div>
      <div class="sub">Where one criterion travels</div>
      <p class="prose t-small" style="margin-bottom:var(--s-4)">Following <b>C1 &mdash; Structural budget deficit</b>, the highest-weighted challenge, through the rest of the process. Nothing here was retyped; each stop reads the same record.</p>
      <div class="trace">
        <div class="trace__c trace__c--on"><span class="trace__s">Step 1</span><span class="trace__l">Profile</span><span class="trace__m">C1, weight 5</span></div>
        <div class="trace__c"><span class="trace__s">Step 3&ndash;4</span><span class="trace__l">Brochure and ad</span><span class="trace__m">Named under Current Challenges</span></div>
        <div class="trace__c"><span class="trace__s">Step 5</span><span class="trace__l">Initial survey</span><span class="trace__m">Question 3</span></div>
        <div class="trace__c"><span class="trace__s">Step 8</span><span class="trace__l">Semifinalist</span><span class="trace__m">Question 2, ARE format</span></div>
        <div class="trace__c"><span class="trace__s">Step 9</span><span class="trace__l">Screening</span><span class="trace__m">Scored 1&ndash;5 per candidate</span></div>
        <div class="trace__c"><span class="trace__s">Step 7&ndash;12</span><span class="trace__l">Interview</span><span class="trace__m">Question 1, Inbox exercise</span></div>
        <div class="trace__c"><span class="trace__s">Step 11</span><span class="trace__l">Finalist matrix</span><span class="trace__m">Row 10, weighted 5</span></div>
        <div class="trace__c"><span class="trace__s">Step 14</span><span class="trace__l">Evaluation</span><span class="trace__m">Result R1, year one</span></div>
      </div>
    </div>
  </div></div></div>`;
}
</script>

<script>
/* ============================================================ view: candidates (Step 9) */
function vCandidates(){
  const r = role();
  const sealed = r==='council' && !state.released;
  const rows = ranked(CANDIDATES).map(c=>{
    const f = fit(c);
    return `<tr class="clickable" data-detail="${c.id}">
      <td><b>${esc(c.name)}</b>${c.internal?' <span class="pill pill--info pill--sm">Internal</span>':''}<div class="t-small" style="color:var(--ink-3)">${esc(c.cur)} &middot; ${esc(c.org)}</div></td>
      <td class="mono tnum">${c.yrs}</td>
      <td>${stagePill(c.stage)}</td>
      <td>${c.semi==='in'?'<span class="pill pill--ok pill--sm">In</span>':c.semi==='out'?'<span class="pill pill--wait pill--sm">Waiting</span>':'<span class="pill pill--idle pill--sm">n/a</span>'}</td>
      <td>${sealed ? '<span class="t-data" style="color:var(--ink-3)">sealed</span>' : bar(f, fitClass(f))}</td>
    </tr>`;
  }).join('');

  const scorers = [
    ['Marisol Vance','Search consultant',8,8],['Dale Okonkwo','Mayor',5,8],['Ruth Alameda','Council',8,8],
    ['Ken Frobisher','Council',8,8],['Sonia Petrakis','Council',3,8],['Ben Utley','Council',0,8],['Ada Ngo','Council',6,8]
  ];

  return `
  ${head('Step 9', 'Screen candidate surveys',
    'Every candidate is reviewed against the same sixteen criteria the Council adopted in Step 1. Scorers work independently and cannot see each other until the search team releases the round.',
    r==='consultant' ? `<button class="btn btn--primary" data-release="1">${state.released?'Scores released':'Release scores to Council'}</button><button class="btn btn--secondary" data-act="export">Export screening record</button>` : '')}
  <div class="section"><div class="wrap"><div class="stack stack--loose">

    ${sealed ? `<div class="seal">
      <span class="pill pill--wait">${ico('lock')}Sealed round</span>
      <div><div class="notice__t">Other scorers are hidden until the round is released</div>
      <div class="notice__b prose">You can see your own scores and enter the ones you still owe. Nobody sees the group rollup until every scorer finishes and the search team releases it. This is what keeps the first read of a candidate from being the loudest voice in the room &mdash; and it gives the Town a clean record of independent review.</div></div>
      <div class="row"><span class="t-small">Waiting on 4 of 7 scorers.</span></div>
    </div>` : ''}

    <div class="spec">
      <div class="spec__bar">Screened candidates<span class="spacer"></span><span class="mono" style="text-transform:none;letter-spacing:0">8 of ${SEARCH.received} advanced</span></div>
      <div class="spec__body spec__body--flush"><div class="tablewrap"><table>
        <thead><tr><th>Candidate</th><th>Yrs</th><th>Stage</th><th>Questionnaire</th><th style="width:190px">Weighted fit</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>
    </div>

    ${r!=='council' ? `<div class="spec">
      <div class="spec__bar">Scorer progress</div>
      <div class="spec__body spec__body--flush"><div class="tablewrap"><table>
        <thead><tr><th>Scorer</th><th>Seat</th><th>Complete</th><th style="width:200px">Progress</th><th></th></tr></thead>
        <tbody>${scorers.map(([n,s,d,t])=>`<tr>
          <td>${esc(n)}</td><td>${esc(s)}</td><td class="mono tnum">${d}/${t}</td>
          <td>${bar(Math.round(d/t*100), d===t?'ok':d===0?'idle':'wait')}</td>
          <td style="text-align:right">${d<t?`<button class="btn btn--secondary btn--sm" data-act="remind" data-who="${esc(n)}">${state.reminded[n]?'Reminder sent':'Send reminder'}</button>`:'<span class="pill pill--ok pill--sm">Done</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div></div>
    </div>`:''}

    <div class="notice notice--info">${ico('info')}<div><div class="notice__t">Twenty-three candidates were not advanced</div>
      <div class="notice__b">Each holds the criteria scores that produced the decision, so the Town can answer a records request or a challenge with the actual review rather than a recollection of it.</div></div></div>
  </div></div></div>`;
}

/* ============================================================ view: candidate detail */
function vDetail(){
  const c = cand(state.sel) || CANDIDATES[0];
  const editable = role()==='consultant' || role()==='council';
  const f = fit(c);
  const groups = ['skill','trait','chall','opp'];

  return `
  ${head('Candidate '+c.id, c.name, `${esc(c.cur)}, ${esc(c.org)} &middot; ${c.yrs} years in local government`)}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="record">
      <div class="record__top">
        <div class="record__no">${c.id} &middot; received 08 Sep 2026</div>
        <h2 class="record__title">${esc(c.name)}</h2>
        <div class="record__meta">
          <div><div class="record__k">Stage</div><div class="record__v">${stagePill(c.stage)}</div></div>
          <div><div class="record__k">Weighted fit</div><div class="record__v">${bar(f, fitClass(f))}</div></div>
          <div><div class="record__k">Initial survey</div><div class="record__v"><span class="pill pill--ok pill--sm">Submitted</span></div></div>
          <div><div class="record__k">Questionnaire</div><div class="record__v">${c.semi==='in'?'<span class="pill pill--ok pill--sm">Submitted</span>':c.semi==='out'?'<span class="pill pill--wait pill--sm">Outstanding</span>':'<span class="pill pill--idle pill--sm">Not sent</span>'}</div></div>
          <div><div class="record__k">Confidentiality</div><div class="record__v">Requested until finalist</div></div>
        </div>
      </div>
      <div class="record__bar">
        <button class="btn btn--secondary btn--sm" data-act="resume">Open resume</button>
        <button class="btn btn--secondary btn--sm" data-act="survey">Survey responses</button>
        <button class="btn btn--secondary btn--sm" data-act="questionnaire">Questionnaire</button>
        <span class="spacer"></span>
        ${role()==='consultant' && c.stage!=='finalist'?`<button class="btn btn--primary btn--sm" data-act="advance">Advance to finalist</button>`:c.stage==='finalist'?'<span class="pill pill--ok pill--sm">Finalist</span>':''}
      </div>
    </div>
    ${state.doc?`<div class="spec"><div class="spec__bar">${state.doc==='resume'?'Resume excerpt':state.doc==='survey'?'Initial survey excerpt':'Semifinalist questionnaire excerpt'}<span class="spacer"></span><button class="btn btn--ghost btn--sm" data-act="closedoc">Close</button></div>
      <div class="spec__body"><p class="t-small" style="white-space:pre-wrap">${state.doc==='resume'?esc(`${c.name}\n${c.cur}, ${c.org}\n${c.yrs} years in local government\n\nSelected experience\n• Led the operating budget and capital program for a comparable organization.\n• Closed or reduced a structural gap; figures are in the survey file.\n• Labor relations, council packets, and intergovernmental work as documented on the application.`):state.doc==='survey'?esc('Q3 — Structural budget gap\nClosed a $1.4M recurring deficit over two cycles without a service reduction. Used a vacancy freeze, a mid-year reforecast, and a council work session on service levels. Documented in the FY24 adopted budget.\n\nQ5 — Contested public process\nRan a six-month annexation process with three open houses, a mailed survey, and a dedicated council night. The ordinance passed 5–2. Opposition remained; the process was not a consensus exercise.'):esc('Q2 — Closing a $2.1M gap\nApproach: 90-day diagnostic with finance, then a two-cycle close plan. Actions: freeze, service-level options, and a capital deferral the council can see. Results: in the last comparable role, $1.4M recurring closed in 24 months.')}</p></div></div>`:''}

    <div>
      <div class="sub">Screening against the adopted profile</div>
      <p class="prose t-small" style="margin-bottom:var(--s-4)">Evidence scale: 1 little, 2 some, 3 solid, 4 strong, 5 exceptional. ${editable?'Your scores are yours until the round is released.':'Read-only in your role.'}</p>
      <div class="grid2 grid2--wide" style="align-items:start">
      ${groups.map(k=>`
        <div class="spec">
          <div class="spec__bar">${esc(KIND[k].plural)}</div>
          <div class="spec__body stack stack--tight">
            ${CRITERIA.filter(x=>x.kind===k).map(x=>`
              <div class="sc">
                <div><div class="sc__l"><span class="mono" style="color:var(--ink-3);font-size:11.5px;margin-right:7px">${x.id}</span>${esc(x.label)}</div>
                <div class="sc__m">Weight ${state.weights[x.id]} &middot; contributes ${Math.round(state.weights[x.id]/CRITERIA.reduce((s,y)=>s+state.weights[y.id],0)*100)}% of the rollup</div></div>
                ${editable
                  ? `<div class="rate rate--num" role="group" aria-label="Score ${esc(x.label)}">
                      ${[1,2,3,4,5].map(n=>`<button type="button" data-score="${c.id}" data-crit="${x.id}" data-val="${n}" aria-pressed="${state.scores[c.id][x.id]===n}">${n}</button>`).join('')}
                     </div>`
                  : `<span class="mx__band mx__band--${band(state.scores[c.id][x.id])}">${state.scores[c.id][x.id]}</span>`}
              </div>`).join('')}
          </div>
        </div>`).join('')}
      </div>
    </div>

    <div class="spec">
      <div class="spec__bar">Screening note</div>
      <div class="spec__body stack">
        <div class="field"><label class="field__label" for="note">What is the evidence, and what is missing?</label>
          <textarea class="input" id="note" data-note="${c.id}" placeholder="Point to the survey answer, resume line, or reference that supports each score. Notes are part of the search record.">${esc(state.notes[c.id] || (c.id==='C-02'?'Strong, specific deficit work at Kestrel Falls: closed $1.4M recurring over two cycles without a service reduction, documented in the FY24 adopted budget. Weakest on aging utility capital — has not run a replacement program at this scale.':''))}</textarea>
        </div>
        <div class="row"><button class="btn btn--primary btn--sm" data-act="savenote">Save note</button><span class="t-small" style="color:var(--ink-3)">Saved to the search record. Visible to the search team.</span></div>
      </div>
    </div>
  </div></div></div>`;
}

/* ============================================================ view: finalists (Step 11) */
function vFinalists(){
  const fin = CANDIDATES.filter(c=>c.stage==='finalist');
  const totalW = CRITERIA.reduce((s,c)=>s+state.weights[c.id],0);
  const rows = CRITERIA.map(x=>`
    <tr>
      <th scope="row"><span class="mono" style="color:var(--ink-3);font-size:11px;margin-right:7px">${x.id}</span>${esc(x.label)}
        <div class="t-small" style="color:var(--ink-3);font-weight:400">${KIND[x.kind].label} &middot; weight ${state.weights[x.id]}</div></th>
      ${fin.map(c=>`<td class="mx__cell"><span class="mx__band mx__band--${band(state.scores[c.id][x.id])}">${state.scores[c.id][x.id]}</span></td>`).join('')}
    </tr>`).join('');

  return `
  ${head('Step 11', 'Finalist comparison',
    'The same sixteen criteria, the same scale, three candidates side by side. Nothing new is introduced here &mdash; the decision is made on the criteria the Council adopted before the position was ever advertised.')}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="tiles">
      ${ranked(fin).map((c,i)=>`<div class="tile ${i===0?'tile--act':''}">
        <span class="tile__k">${esc(c.name)}</span>
        <span class="tile__v">${fit(c)}<span style="font-size:1rem;color:var(--ink-3)">%</span></span>
        <span class="tile__n">${esc(c.org)}</span></div>`).join('')}
      <div class="tile"><span class="tile__k">Total weight</span><span class="tile__v">${totalW}</span><span class="tile__n">Across 16 criteria</span></div>
    </div>

    <div class="spec">
      <div class="spec__bar">Criterion by criterion<span class="spacer"></span><span class="mono" style="text-transform:none;letter-spacing:0">Screening + questionnaire evidence</span></div>
      <div class="spec__body spec__body--flush"><div class="tablewrap"><table class="mx">
        <thead><tr><th style="min-width:220px">Criterion</th>${fin.map(c=>`<th style="text-align:center">${esc(c.name.split(' ')[0])}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${esc(c.name.split(' ')[1])}</span></th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><th scope="row">Weighted fit</th>${fin.map(c=>`<td class="mx__cell"><b>${fit(c)}%</b></td>`).join('')}</tr></tfoot>
      </table></div></div>
    </div>

    <div class="grid2">
      <div class="notice notice--info">${ico('info')}<div><div class="notice__t">The matrix is a starting point, not the decision</div>
        <div class="notice__b">A one-point spread is noise. Where the matrix earns its keep is showing the Council <em>where</em> candidates differ, so the conversation is about the water capital gap rather than about who interviewed warmly.</div></div></div>
      <div class="notice notice--wait">${ico('alert')}<div><div class="notice__t">Interview and scenario results are not in this view yet</div>
        <div class="notice__b">Finalist week runs 3&ndash;5 November. Scorecards from the Council panel, staff panel, and community panel land in these same rows, marked by source.</div></div></div>
    </div>
  </div></div></div>`;
}

function vSurveys(){

    <div class="q">
      <div class="q__hd"><span class="q__n">${String(q.n).padStart(2,'0')}</span><span class="q__t">${esc(q.t)}${q.req?' <span class="field__req">*</span>':''}</span></div>

        <div class="t-small" style="color:var(--ink-3)">${q.type==='are'?'Long answer, ARE format — approach, results, experience':q.type==='long'?'Long answer':q.type==='yesno-detail'?'Yes / No, detail required if yes':'Short answer'}</div>

      </div>
    </div>`;

  return `
  ${head('Steps 5, 8, and 10', 'Surveys',
    'Two instruments, both built from the profile. Every scored question names the criteria it tests, which is what lets a written answer become a number in the screening rollup instead of an impression somebody remembers.',
    role()==='consultant'?`<button class="btn btn--primary" data-act="newinstrument">New instrument</button><button class="btn btn--secondary" data-act="surveyremind">Send reminders</button>`:'')}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="grid2">
      <div class="spec"><div class="spec__bar">Step 5 &middot; ${esc(SURVEY_INITIAL.name)}<span class="spacer"></span><span class="pill pill--idle pill--sm">Closed</span></div>
        <div class="spec__body"><div class="record__meta">
          <div><div class="record__k">Sent</div><div class="record__v mono tnum">${SURVEY_INITIAL.sent}</div></div>
          <div><div class="record__k">Returned</div><div class="record__v mono tnum">${SURVEY_INITIAL.back}</div></div>
          <div><div class="record__k">Questions</div><div class="record__v mono tnum">${SURVEY_INITIAL.qs.length}</div></div>
          <div><div class="record__k">Closed</div><div class="record__v">${SURVEY_INITIAL.due}</div></div>
        </div></div></div>
      <div class="spec"><div class="spec__bar">Step 8 &middot; ${esc(s.name)}<span class="spacer"></span><span class="pill pill--wait pill--sm">Open</span></div>
        <div class="spec__body"><div class="record__meta">
          <div><div class="record__k">Sent</div><div class="record__v mono tnum">${s.sent}</div></div>
          <div><div class="record__k">Returned</div><div class="record__v mono tnum">${semiStats().back}</div></div>
          <div><div class="record__k">Questions</div><div class="record__v mono tnum">${s.qs.length}</div></div>
          <div><div class="record__k">Due</div><div class="record__v">${s.due}</div></div>
        </div></div></div>
    </div>

    <div>
      <div class="sub">Step 8 questionnaire &mdash; what each question tests</div>
      <div class="stack stack--tight">${s.qs.map(q=>qcard(q,s)).join('')}</div>
    </div>

    <div>
      <div class="sub">Step 5 initial survey</div>
      <div class="stack stack--tight">${SURVEY_INITIAL.qs.map(q=>qcard(q,SURVEY_INITIAL)).join('')}</div>
    </div>

    <div class="notice notice--info">${ico('info')}<div><div class="notice__t">How responses come back</div>
      <div class="notice__b">Each candidate gets a single-use link, no account and no password to forget. Responses land straight on the candidate file, ready to score. The firm sees who has answered and who needs a nudge; candidates see nothing but their own form.</div></div></div>

    <div class="notice notice--info">${ico('info')}<div><div class="notice__t">Coverage check</div>
      <div class="notice__b">Slate flags any adopted criterion no instrument tests. Right now every criterion of weight 4 or higher is covered by at least one survey question and one interview question. <b>S5 Intergovernmental relations</b> is tested at interview only &mdash; acceptable at weight 3, worth a survey question if the Council raises it.</div></div></div>
  </div></div></div>`;
}

/* ============================================================ view: interview guide (Steps 7, 12) */
function vGuide(){
  return `
  ${head('Steps 7 and 12', 'Interview guide',
    'Questions in ARE format &mdash; Approach, Results, Experience. Standardized across every finalist so the comparison holds, with follow-ups that push past the rehearsed answer.',

      <cite>The ARE format, from the firm&rsquo;s process</cite></div>

    <div class="stack stack--tight">

      <div class="q">
        <div class="q__hd"><span class="q__n">Q${g.n}</span><span class="q__t">${esc(g.q)}</span></div>

            <div class="t-label" style="color:var(--accent)">Approach</div><div class="t-small">${esc(g.a)}</div></div>

            <div class="t-label" style="color:var(--accent)">Results</div><div class="t-small">${esc(g.r)}</div></div>
          <div class="are">
            <div class="t-label" style="color:var(--accent)">Experience</div><div class="t-small">${esc(g.e)}</div></div>
        </div>
        <div class="q__ft"><span class="t-label">Tests</span>${g.crit.map(id=>critChip(id,true)).join('')}</div>
      </div>`).join('')}
    </div>

    <div>
      <div class="sub">Assessment scenarios</div>
      <div class="grid2 grid2--wide">
      ${SCENARIOS.map(s=>`
        <div class="spec">
          <div class="spec__bar">${s.id}<span class="spacer"></span><span class="mono" style="text-transform:none;letter-spacing:0">${s.mins} min</span></div>
          <div class="spec__body stack stack--tight">
            <h3 class="t-head">${esc(s.name)}</h3>

            <div class="crits">${s.crit.map(id=>critChip(id,true)).join('')}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>

    <div class="notice notice--ok">${ico('check')}<div><div class="notice__t">Every finalist gets the same core experience</div>
      <div class="notice__b">Same questions, same scenarios, same order, same clock. Slate builds the three schedules from one template, so a candidate who interviews on Thursday is not answering a different set than the one who came Tuesday.</div></div></div>
  </div></div></div>`;
}

/* ============================================================ view: scorecard (panel) */
function vScorecard(){
  const s = SCENARIOS[1];

/* ============================================================ view: blueprint */
function vBlueprint(){
  const perms = [
    ['Build and weight the candidate profile','Edit','Comment and vote','View','—'],
    ['Draft brochure, advertisement, plan','Edit','Approve','Edit','—'],
    ['Build surveys and the interview guide','Edit','Comment','View','—'],
    ['See the full applicant list','All','Screened only','All','—'],
    ['Open a candidate file and its responses','All','Screened only','All','—'],
    ['Score candidates against criteria','Yes','Yes','—','Assigned only'],
    ['See other people’s scores','After release','After release','—','Never'],
    ['Release a sealed scoring round','Yes','—','—','—'],
    ['Schedule finalist week','Yes','Confirm','Yes','Confirm'],
    ['Draft the employment agreement','Yes','Approve','Yes','—'],
    ['Complete the annual evaluation','Facilitate','Yes','Facilitate','—'],
    ['Export the search record','Yes','Yes','Yes','—']
  ];
  const cell = v => v==='—' ? '<span class="no">—</span>'
    : ['Yes','Edit','All'].includes(v) ? `<span class="yes">${esc(v)}</span>`
    : `<span class="part">${esc(v)}</span>`;

  const objects = [
    ['Engagement','One search for one client. Owns everything below.','client, position, dates, stage'],
    ['Criterion','A single line of the Step 1 profile. The spine object.','id, kind, label, weight, note'],
    ['Instrument','A survey, questionnaire, interview guide, or scenario.','step, questions, each question → criteria'],
    ['Person','A hiring-side user with one role in one engagement.','role, seat, scope'],
    ['Candidate','An applicant file. A record, not an account.','stage, documents, responses, consents'],
    ['Score','One person, one candidate, one criterion, one source.','value 1–5, source, sealed flag, note'],
    ['Cycle','An annual evaluation round after the hire.','expectations, goals, ratings, governance survey']
  ];

  return `
  ${head('The platform', 'How Slate works',
    'The process already works on paper. What it does not do on paper is stay connected when seven Council members, a staff panel, a client HR office, and thirty-one candidates all touch it at once. Three decisions carry the whole design.')}

  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="grid3">
      <div class="spec"><div class="spec__bar">Decision one</div><div class="spec__body stack stack--tight">
        <h3 class="t-head">The profile is data, not a document</h3>
        <p class="t-small">Step 1 produces sixteen records with stable identifiers and weights. Every later step references them instead of restating them. That is the difference between a connected process and fourteen Word files that drift apart by October.</p></div></div>
      <div class="spec"><div class="spec__bar">Decision two</div><div class="spec__body stack stack--tight">
        <h3 class="t-head">Scoring is independent, then released</h3>
        <p class="t-small">Scorers cannot see each other until a round is released. It prevents anchoring, it survives a records request, and it gives a divided Council a defensible account of how the decision was made.</p></div></div>
      <div class="spec"><div class="spec__bar">Decision three</div><div class="spec__body stack stack--tight">
        <h3 class="t-head">Everyone sees one search, scoped</h3>
        <p class="t-small">Four roles on the hiring side, one dataset. An assessor sees one exercise. Nobody gets a second copy of the truth, and nobody gets access they do not need. Candidates are records here, not users.</p></div></div>
    </div>

    <div>
      <div class="sub">Who can do what</div>
      <div class="tablewrap"><table class="perm">
        <thead><tr><th style="min-width:280px">Capability</th><th>Consultant</th><th>Governing body</th><th>Staff liaison</th><th>Assessor</th></tr></thead>
        <tbody>${perms.map(p=>`<tr><td>${esc(p[0])}</td>${p.slice(1).map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
      <p class="t-small" style="color:var(--ink-3);margin-top:var(--s-3)">Switch the user in the left rail to see each of these applied. The navigation, the dashboards, and the scoring visibility all change with the role.</p>
    </div>

    <div>
      <div class="sub">What the system stores</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Object</th><th>What it is</th><th>Key fields</th></tr></thead>
        <tbody>${objects.map(o=>`<tr><td><b>${esc(o[0])}</b></td><td>${esc(o[1])}</td><td class="t-data" style="color:var(--ink-3)">${esc(o[2])}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div>
      <div class="sub">What this has to get right to be used</div>
      <div class="grid2 grid2--wide">
        <div class="notice notice--stop">${ico('alert')}<div><div class="notice__t">Public records and open meetings</div>
          <div class="notice__b">Search material in most states is a public record, and finalist names usually become disclosable. The platform has to hold candidate consent, log who saw what and when, and export a clean record on request. It must not become a way for a quorum of the governing body to deliberate outside a noticed meeting &mdash; independent scoring is fine, threaded discussion between members is not, which is why Slate has no such thread.</div></div></div>
        <div class="notice notice--wait">${ico('alert')}<div><div class="notice__t">Council members are occasional users</div>
          <div class="notice__b">A Council member logs in perhaps eight times across a five-month search, often on a phone, often at night. Anything that needs a manual is dead. The Council-facing surface is deliberately three screens: my tasks, the candidates, the comparison.</div></div></div>
        <div class="notice notice--info">${ico('info')}<div><div class="notice__t">Confidentiality is why good candidates apply at all</div>
          <div class="notice__b">Sitting managers will not apply if their own council might read about it. The platform has to carry a confidentiality flag on every file, block reference contact until consent is recorded, and warn the team before finalist names become disclosable. Get this wrong once and the firm&rsquo;s applicant pool shrinks for years.</div></div></div>
        <div class="notice notice--ok">${ico('check')}<div><div class="notice__t">The firm runs many searches at once</div>
          <div class="notice__b">Profiles, instruments, and scenario templates are reusable across engagements. A new Town Manager search starts from the last one and gets edited down, which is where the firm&rsquo;s margin actually is.</div></div></div>
      </div>
    </div>

    <div>
      <div class="sub">A sensible build order</div>
      <div class="spec"><div class="spec__body"><div class="steps">
        <div class="step step--done"><div class="step__n">01</div><div><div class="step__t">Profile, instruments, and response intake</div>
          <div class="step__d">Steps 1, 5, 8, and 10. Replaces the survey tool and the email chain, and it is usable on its own from the first search.</div>
          <div class="step__foot"><span class="pill pill--info pill--sm">Highest value first</span></div></div></div>
        <div class="step step--done"><div class="step__n">02</div><div><div class="step__t">Screening, sealed rounds, and the finalist matrix</div>
          <div class="step__d">Steps 9 and 11. Brings the governing body in as users, which is the first time the platform faces people who did not choose it.</div></div></div>
        <div class="step step--now"><div class="step__n">03</div><div><div class="step__t">Interview guide, scenarios, and assessment scheduling</div>
          <div class="step__d">Steps 7 and 12, including the panel scorecards. Heaviest logistics, so it benefits from two searches of real use behind it.</div></div></div>
        <div class="step"><div class="step__n">04</div><div><div class="step__t">Agreement tracking and the annual evaluation</div>
          <div class="step__d">Steps 13 and 14. These extend the relationship past the hire and give the firm a recurring engagement rather than a one-time placement.</div>
          <div class="step__foot"><span class="pill pill--ok pill--sm">Where the recurring revenue is</span></div></div></div>
        <div class="step"><div class="step__n">05</div><div><div class="step__t">Multi-engagement templates and the firm dashboard</div>
          <div class="step__d">Steps 2, 3, 4, and 6 as reusable assets across every search the firm runs.</div></div></div>
      </div></div></div>
    </div>

    <div class="notice notice--info">${ico('info')}<div><div class="notice__t">About this prototype</div>
      <div class="notice__b">Sample data throughout, describing a fictional client. Weights and scores are live &mdash; changing them recalculates the rollups &mdash; but nothing is saved. Built on the Docket design system, revision 2.0, using its tokens, type, and components unchanged.</div></div></div>
  </div></div></div>`;
}

      </div>
      <div class="notice notice--info">${ico('info')}<div><div class="notice__t">The plan uses four ad versions, not one posting everywhere</div>
        <div class="notice__b">That is the Step 4 rule. Each row names the version it runs, so a social post is not a paste of the ICMA listing, and the association brief is not a brochure.</div></div></div>`
  }[tab];

  return `
  ${head('Steps 2, 3, 4, and 6', 'Recruiting materials',
    'Community profile, brochure, advertisements, and the posting plan — each written from the same adopted criteria, so the job being sold is the job being scored.',
    role()==='consultant'?`<button class="btn btn--primary" data-act="publish">Publish current packet</button><button class="btn btn--secondary" data-act="export">Export PDF</button>`:'')}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="tabs" role="tablist">
      ${tabs.map(([id,l])=>`<button type="button" class="tab" data-tab="${id}" aria-selected="${tab===id}">${l}</button>`).join('')}
    </div>
    ${body}
  </div></div></div>`;
}

/* ============================================================ view: schedule (Step 12) */
function vSchedule(){
  const fins = CANDIDATES.filter(c=>c.stage==='finalist');
  const days = [
    ['Tue 3 Nov','Community tour and staff briefings','Same packet, same stops, same briefers. Candidates rotate; the tour does not.'],
    ['Wed 4 Nov','Council interview, presentation, inbox','ARE questions from the guide, then SCN-1 and SCN-3. Order is the same for every finalist.'],
    ['Thu 5 Nov','Staff exercise, community panel, wrap','SCN-2 with directors in the morning. Leaderless group in the afternoon if three finalists remain.']
  ];
  return `
  ${head('Step 12', 'Finalist week',
    'Every finalist gets the same core experience: same questions, same scenarios, same clock. The schedule is one template applied three times, not three custom days.',
    role()==='consultant'?`<button class="btn btn--primary" data-act="publish">Issue the schedule</button><button class="btn btn--secondary" data-go="guide">Open the interview guide</button>`:'')}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="tiles">
      ${fins.map(c=>`<div class="tile"><span class="tile__k">${esc(c.name)}</span><span class="tile__v" style="font-size:1.35rem">${esc(c.cur.split(' ')[0])}</span><span class="tile__n">${esc(c.org)}</span></div>`).join('')}
      <div class="tile tile--act"><span class="tile__k">Core experience</span><span class="tile__v">1</span><span class="tile__n">Template, three applications</span></div>
    </div>
    <div class="spec">
      <div class="spec__bar">Week of 3 November 2026</div>
      <div class="spec__body spec__body--flush"><div class="tablewrap"><table>
        <thead><tr><th>Day</th><th>Block</th><th>What is held constant</th></tr></thead>
        <tbody>${days.map(([d,b,n])=>`<tr><td class="mono">${d}</td><td>${esc(b)}</td><td class="t-small">${esc(n)}</td></tr>`).join('')}</tbody>
      </table></div></div>
    </div>
    <div class="spec">
      <div class="spec__bar">Assessment stations — same for each finalist</div>
      <div class="spec__body stack stack--tight">
        ${SCENARIOS.map(s=>`<div class="sc"><div><div class="sc__l">${esc(s.name)}</div><div class="sc__m">${s.mins} min · observed by ${esc(s.who)}</div></div><div class="crits">${s.crit.map(id=>critChip(id,true)).join('')}</div></div>`).join('')}
      </div>
    </div>
    <div class="notice notice--ok">${ico('check')}<div><div class="notice__t">A Thursday candidate is not answering a different job than a Tuesday candidate</div>
      <div class="notice__b">That is the whole point of Step 12. The comparison in Step 11 only holds if the evidence was gathered the same way.</div></div></div>
  </div></div></div>`;
}

/* ============================================================ view: apply (candidate) */
function vApply(){
  const s = SURVEY_SEMI;
  if(state.submitted){
    return `
    ${head('Semifinalist questionnaire', 'Received', 'Thank you. Your responses are on the search file. The Town will contact you if you are selected as a finalist. No references will be called before then.')}
    <div class="section"><div class="wrap">
      <div class="notice notice--ok">${ico('check')}<div><div class="notice__t">Submitted 12 Oct 2026</div>
        <div class="notice__b">You can close this page. If you need to correct something, write the search consultant — the form itself does not reopen.</div></div></div>
    </div></div>`;
  }
  return `
  ${head('Town of Ridgeline', 'Semifinalist questionnaire',
    esc(s.intro),
    `<span class="pill pill--wait">Due ${s.due}</span>`)}
  <div class="section"><div class="wrap"><div class="stack stack--loose">
    <div class="notice notice--info">${ico('lock')}<div><div class="notice__t">This link is yours alone</div>
      <div class="notice__b">No account. No password. Responses go to the search file, not to other applicants, and not to the Council until the search team releases a round.</div></div></div>
    ${s.qs.map(q=>`
      <div class="q">
        <div class="q__hd"><span class="q__n">${String(q.n).padStart(2,'0')}</span><span class="q__t">${esc(q.t)}${q.req?' <span class="field__req">*</span>':''}</span></div>
        <div class="q__bd">
          <div class="t-small" style="color:var(--ink-3);margin-bottom:var(--s-2)">${q.type==='are'?'Please address approach, actions, and measurable results.':''}</div>
          <label class="field__label" for="ans-${q.n}">Your response</label>
          <textarea class="input" id="ans-${q.n}" data-ans="${q.n}" placeholder="Write in enough detail that a reader who does not know you can see what you did.">${esc(state.survey[q.n]||'')}</textarea>
        </div>
        <div class="q__ft"><span class="t-label">This question is used to assess</span>${q.crit.map(id=>critChip(id,true)).join('')}</div>
      </div>`).join('')}
    <div class="row"><button class="btn btn--primary" data-act="submit-survey">Submit questionnaire</button>
      <span class="t-small" style="color:var(--ink-3)">You will not be able to edit after you submit.</span></div>
  </div></div></div>`;
}

/* ============================================================ render */
const RENDER = {
  overview:vOverview, process:vProcess, profile:vProfile, candidates:vCandidates, detail:vDetail,
  finalists:vFinalists, surveys:vSurveys, guide:vGuide, scorecard:vScorecard, contract:vContract,
  evaluation:vEvaluation, blueprint:vBlueprint, recruiting:vRecruiting, schedule:vSchedule, apply:vApply
};
function render(){
  renderWho(); renderNav(); renderCrumbs();
  $('#view').innerHTML = (RENDER[state.view] || vOverview)();
}

/* ============================================================ events */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-user],[data-go],[data-detail],[data-weight],[data-score],[data-rate],[data-release],[data-theme-set],[data-act],[data-tab]');
  if(!t) return;

  if(t.dataset.themeSet){
    const v = t.dataset.themeSet;
    if(v==='auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.themeSet===v)));
    return;
  }
  if(t.dataset.user){ setUser(t.dataset.user); return; }
  if(t.dataset.detail){ go('detail', t.dataset.detail); return; }
  if(t.dataset.go){
    if(t.dataset.tab) state.tab = t.dataset.tab;
    go(t.dataset.go);
    return;
  }
  if(t.dataset.tab){ state.tab = t.dataset.tab; render(); return; }
  if(t.dataset.release){ state.released = true; toast('Scores released to Council. The round is now visible to every scorer.'); render(); return; }

  if(t.dataset.weight){ state.weights[t.dataset.weight] = Number(t.dataset.val); render(); return; }
  if(t.dataset.score){ state.scores[t.dataset.score][t.dataset.crit] = Number(t.dataset.val); render(); return; }
  if(t.dataset.rate){
    const k = t.dataset.rate;
    state.ratings[k] = state.ratings[k]===t.dataset.val ? null : t.dataset.val;
    document.querySelectorAll(`[data-rate="${k}"]`).forEach(b=>b.setAttribute('aria-pressed', String(state.ratings[k]===b.dataset.val)));
    return;
  }
  if(t.dataset.act){
    const act = t.dataset.act;
    if(act==='remind'){ state.reminded[t.dataset.who] = true; toast('Reminder sent to '+t.dataset.who+'.'); render(); return; }
    if(act==='export'){ toast('Screening record downloaded. In production this is a timestamped PDF of scores and notes.'); return; }
    if(act==='publish'){ toast('Revision 4 published. Council will see the current weights on next login.'); return; }
    if(act==='compare'){ toast('Revision 3 kept S1 at weight 4. Revision 4 raised it to 5 after the June 12 work session.'); return; }
    if(act==='resume' || act==='survey' || act==='questionnaire'){ state.doc = act; render(); return; }
    if(act==='closedoc'){ state.doc = null; render(); return; }
    if(act==='advance'){
      const c = cand(state.sel); if(c){ c.stage = 'finalist'; toast(c.name+' advanced to finalist. The comparison matrix now includes this file.'); }
      render(); return;
    }
    if(act==='savenote'){
      const area = $('#note');
      if(area && state.sel) state.notes[state.sel] = area.value;
      toast('Note saved to the search record.');
      return;
    }
    if(act==='newinstrument'){ toast('New instrument starts from the adopted profile, so every question is tagged to a criterion before it can be sent.'); return; }
    if(act==='surveyremind'){
      const who = semiStats().out;
      if(!who.length){ toast('Every questionnaire is in. No reminders to send.'); return; }
      toast('Reminder sent to '+who.map(c=>c.name).join(', ')+'. The questionnaire is still due 12 Oct.');
      return;
    }
    if(act==='addquestion'){ toast('New questions must name at least one adopted criterion. Untagged questions cannot be scored.'); return; }
    if(act==='submit-score'){ state.scorecardIn = true; toast('Scorecard submitted. It cannot be edited.'); render(); return; }
    if(act==='savedraft'){ toast('Draft saved on this device. Nothing is stored on a server in this prototype.'); return; }
    if(act==='counsel'){ toast('Draft sent to the Town Attorney. Three terms remain open until counsel and Council both sign off.'); return; }
    if(act==='icma'){ toast('Ridgeline draft follows the ICMA model on term, severance, and evaluation. Residency and automobile are the local additions.'); return; }
    if(act==='submit-eval'){ toast('Your evaluation is in and sealed until the remaining Council members submit.'); return; }
    if(act==='opencycle'){ toast('Year-one cycle is already open. Expectations were loaded from the adopted profile.'); return; }
    if(act==='submit-survey'){
      const empty = SURVEY_SEMI.qs.some(q=>q.req && !(state.survey[q.n]||'').trim());
      if(empty){ toast('Please complete every required question before submitting.'); return; }
      state.submitted = true;
      const ilene = cand('C-05'); if(ilene) ilene.semi = 'in';
      toast('Questionnaire submitted. The search team can see it on your file.');
      render(); return;
    }
  }
});

document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset.ans){ state.survey[t.dataset.ans] = t.value; }
  if(t.dataset.note && state.sel){ state.notes[state.sel] = t.value; }
});

render();
</script>
