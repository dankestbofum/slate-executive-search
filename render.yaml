# Render blueprint.
#
# One web service, built from the Dockerfile, with a disk. The store is a
# single JSON file with one writer, so this deliberately runs a single
# instance: two would overwrite each other's records.
#
# Secrets are marked `sync: false`, which means Render prompts for them once
# and never reads them from this file. Nothing secret belongs in the repo.

services:
  - type: web
    name: slate
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A disk needs a paid instance type; free instances have no persistent
    # storage, and production refuses to start without one.
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    numInstances: 1

    # Production will not start without DATA_DIR pointing at real storage.
    # That guard is what stops records from being written into the container
    # filesystem and lost on the next deploy.
    disk:
      name: slate-store
      mountPath: /data
      sizeGB: 1

    envVars:
      # Release identity is deliberately NOT set here.
      #
      # Render builds the image itself and does not pass --build-arg, so the
      # image's SLATE_RELEASE is "unknown" on a blueprint deploy; the app then
      # falls back to RENDER_GIT_COMMIT, which Render supplies at runtime and
      # which describes the deploy that is actually running. Setting
      # SLATE_RELEASE by hand here would override that with a value nobody
      # updates, which is how a running service came to report a commit that
      # did not contain the code it was running. /api/ready reports both and
      # flags a disagreement.
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        # A fresh owner workspace on the existing disk. Prior records at
        # /data/slate.json remain available for rollback.
        value: /data/clean-owner

      # Identity. Without these every workspace request answers 503; there is
      # no fallback to open access.
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # The deployed origin, e.g. https://slate.onrender.com or the custom
      # domain. Set it once the service has a URL.
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Optional. Where Clerk sends somebody who follows an organization
      # invitation; unset uses Slate's /join page at SLATE_PUBLIC_URL.
      - key: SLATE_INVITATION_REDIRECT_URL
        sync: false
      # Who may create a new firm workspace here, comma-separated. Empty means
      # nobody, which is the right answer for a URL anyone can reach: set it to
      # the first administrator's verified email to stand the firm up, and
      # everybody else joins by invitation. It grants nothing over any workspace
      # that already exists.
      - key: SLATE_WORKSPACE_FOUNDERS
        sync: false

      # Drafting and city research. The app serves without it; only those two
      # features stop.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_MODEL_PREMIUM
        value: claude-opus-5-5

      # Checkout is deliberately off until the pilot offer, model access,
      # spending limits, and Stripe test flow are verified.
      - key: SLATE_PROJECT_BILLING_MODE
        value: off
      - key: SLATE_PROJECT_OFFER_VERSION
        value: pilot-1
      - key: SLATE_PROJECT_AMOUNT_CENTS
        sync: false
      - key: SLATE_PROJECT_CURRENCY
        value: usd
      - key: SLATE_PROJECT_STRIPE_PRICE_ID
        sync: false
      - key: SLATE_PROJECT_AI_ALLOWANCE_USD
        sync: false
      - key: SLATE_AI_RESERVATION_USD
        sync: false
      - key: SLATE_AI_DEPLOYMENT_CEILING_USD
        sync: false
      - key: SLATE_OPUS_55_VERIFIED
        value: "0"
      - key: SLATE_CENSUS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Research limits. Nonsecret, so they are set here rather than prompted
      # for: they bound one operation end to end (crawl, model rounds, write)
      # instead of bounding each provider call separately, which is what let a
      # stalled attempt plus a retry run for six minutes. Raise them only with
      # measurements from the operation reference in the logs.
      - key: SLATE_RESEARCH_TIMEOUT_MS
        value: "180000"
      - key: SLATE_RESEARCH_CRAWL_TIMEOUT_MS
        value: "25000"
      - key: SLATE_RESEARCH_MAX_ROUNDS
        value: "4"

      # Shown to candidates who cannot proceed on their own.
      - key: SLATE_SUPPORT_EMAIL
        sync: false
      # The public address of this deployment, used for the posting URL shown
      # to staff and for the return link in an applicant's confirmation email.
      # Set it here rather than letting the application fall back to the
      # request's Host header, which the client supplies: a spoofed Host would
      # otherwise end up as the link in a confirmation message.
      - key: SLATE_PUBLIC_URL
        sync: false
