<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slate — Executive Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Fonts are served from this origin rather than a third-party CDN.
       Candidate questionnaire pages are opened by the public from a bearer
       link, and an off-origin font request would disclose their IP address
       and the page they opened. Regenerate: node scripts/vendor-fonts.js -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1D4E89">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-512.png">
</head>
<body>
  <div id="app"></div>
  <div class="lookup" id="lookup" hidden role="dialog" aria-modal="true" aria-labelledby="lookup-title" aria-describedby="lookup-copy">
    <div class="lookup__card" tabindex="-1">
      <div class="lookup__spin" aria-hidden="true"></div>
      <div class="t-label" id="lookup-kicker">Working</div>
      <h2 class="lookup__title" id="lookup-title">Working</h2>
      <p class="lookup__copy" id="lookup-copy">Stay on this page.</p>
      <div class="mono t-small" id="lookup-site"></div>
      <ol class="lookup__steps" id="lookup-steps" aria-live="polite"></ol>
    </div>
  </div>
  <div class="toast" id="toast" hidden role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
